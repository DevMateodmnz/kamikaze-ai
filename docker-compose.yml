services:
  postgres:
    image: postgres:15-alpine
    container_name: kamikaze-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kamikaze}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamikaze_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kamikaze_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kamikaze} -d ${POSTGRES_DB:-kamikaze_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: kamikaze-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - N8N_HOST=${N8N_HOST:-localhost}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-kamikaze_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-kamikaze}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-kamikaze_dev_password}
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=all
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      # API key for programmatic access (public REST API at /api/v1/)
      - N8N_API_KEY=${N8N_API_KEY}
      # Workflow variables (read by n8n nodes via $env)
      - BACKEND_URL=${BACKEND_URL:-http://172.17.0.1:3000}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-change_me_to_a_secure_random_key}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
